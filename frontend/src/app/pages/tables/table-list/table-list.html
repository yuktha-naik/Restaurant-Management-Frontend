<div class="page-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Restaurant Tables</mat-card-title>
      <span class="spacer"></span>
      @if (isManager) {
        <button mat-raised-button color="primary" (click)="router.navigate(['/tables/new'])">
          <mat-icon>add</mat-icon> Add Table
        </button>
      }
    </mat-card-header>
    <mat-card-content>
      @if (loading) { <p>Loading...</p> }
      @else {
        <table mat-table [dataSource]="tables" class="full-width">
          <ng-container matColumnDef="tableId">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let t">{{ t.tableId }}</td>
          </ng-container>
          <ng-container matColumnDef="tableNumber">
            <th mat-header-cell *matHeaderCellDef>Table No.</th>
            <td mat-cell *matCellDef="let t">{{ t.tableNumber }}</td>
          </ng-container>
          <ng-container matColumnDef="capacity">
            <th mat-header-cell *matHeaderCellDef>Capacity</th>
            <td mat-cell *matCellDef="let t">{{ t.capacity }}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let t">
              <mat-chip [color]="statusColor(t.status)" highlighted>{{ t.status }}</mat-chip>
            </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let t">
              @if ((isManager || isWaiter) && t.tableId) {
                <button mat-icon-button color="primary" (click)="edit(t.tableId)"><mat-icon>edit</mat-icon></button>
              }
              @if (isManager && t.tableId) {
                <button mat-icon-button color="warn" (click)="delete(t.tableId)"><mat-icon>delete</mat-icon></button>
              }
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      }
    </mat-card-content>
  </mat-card>
</div>
