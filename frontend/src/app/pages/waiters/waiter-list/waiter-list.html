<div class="page-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Waiters</mat-card-title>
      <span class="spacer"></span>
      @if (isManager) {
        <button mat-raised-button color="primary" (click)="router.navigate(['/waiters/new'])">
          <mat-icon>add</mat-icon> Add Waiter
        </button>
      }
    </mat-card-header>
    <mat-card-content>
      @if (loading) { <p>Loading...</p> }
      @else {
        <table mat-table [dataSource]="waiters" class="full-width">
          <ng-container matColumnDef="waiterId">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let w">{{ w.waiterId }}</td>
          </ng-container>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let w">{{ w.name }}</td>
          </ng-container>
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let w">{{ w.email }}</td>
          </ng-container>
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let w">{{ w.phone }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let w">
              @if (isManager && w.waiterId) {
                <button mat-icon-button color="primary" (click)="edit(w.waiterId)"><mat-icon>edit</mat-icon></button>
                <button mat-icon-button color="warn" (click)="delete(w.waiterId)"><mat-icon>delete</mat-icon></button>
              }
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      }
    </mat-card-content>
  </mat-card>
</div>
